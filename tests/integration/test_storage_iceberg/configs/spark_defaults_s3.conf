spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.spark_catalog.catalog-impl    org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.spark_catalog.uri             http://127.0.0.1:8181
spark.sql.catalog.spark_catalog.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.spark_catalog.warehouse       s3a://warehouse/wh/
spark.sql.catalog.spark_catalog.s3.endpoint     http://minio:9001
spark.sql.defaultCatalog               spark_catalog
spark.eventLog.enabled                 true
#spark.eventLog.dir                     /home/iceberg/spark-events
#spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory
